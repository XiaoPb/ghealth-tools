name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 生成变更日志需要完整提交历史与全部 tag
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Extract tag version
        id: tag_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify tag matches app versionName
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ "${VERSION_NAME}" != "${{ steps.tag_version.outputs.VERSION }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 app versionName ${VERSION_NAME} 不一致"
            exit 1
          fi
          echo "versionName ${VERSION_NAME} 与 tag 一致"

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "storeFile=ghealth-release.keystore" > keystore.properties
          echo "storePassword=$STORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Rename APK with tag version
        run: |
          TAG_VERSION="${{ steps.tag_version.outputs.VERSION }}"
          mv app/build/outputs/apk/release/ghealth-tools-*.apk \
             app/build/outputs/apk/release/ghealth-tools-${TAG_VERSION}.apk

      - name: Generate release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            COMPARE="[$PREV_TAG...$TAG](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG})"
          else
            RANGE="${TAG}"
            COMPARE="[$TAG](https://github.com/${GITHUB_REPOSITORY}/commits/${TAG})"
          fi

          mkdir -p .release
          for key in feat fix perf refactor build ci docs test style other; do
            : > ".release/${key}.md"
          done

          while IFS=$'\t' read -r short subject; do
            [ -z "${subject}" ] && continue
            type=$(printf '%s' "${subject}" | sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p')
            case "${type}" in
              feat|fix|perf|refactor|build|ci|docs|test|style) ;;
              *) type=other ;;
            esac
            printf -- '- %s (`%s`)\n' "${subject}" "${short}" >> ".release/${type}.md"
          done < <(git log --no-merges --pretty=format:'%h%x09%s%n' "${RANGE}")

          CONTRIBUTORS="$(git log --no-merges --pretty='%an' "${RANGE}" | sort -u | paste -sd ', ' -)"
          COMMIT_COUNT="$(git rev-list --count --no-merges "${RANGE}")"

          APK="app/build/outputs/apk/release/ghealth-tools-${{ steps.tag_version.outputs.VERSION }}.apk"
          APK_SIZE="$(du -h "${APK}" | cut -f1)"
          APK_SHA256="$(sha256sum "${APK}" | cut -d' ' -f1)"

          {
            echo "## 版本信息"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${TAG}\` |"
            echo "| 版本号 | \`${{ steps.tag_version.outputs.VERSION }}\` |"
            echo "| 提交 | \`${GITHUB_SHA::7}\` |"
            echo "| 提交数量 | ${COMMIT_COUNT} |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| 运行环境 | Android 7.0+ (minSdk 24) |"
            echo "| 编译环境 | compileSdk 37 / JDK 17 |"
            echo "| 安装包大小 | ${APK_SIZE} |"
            echo "| SHA-256 | \`${APK_SHA256}\` |"
            echo ""
            echo "## 变更内容"
            echo ""
            for key in feat fix perf refactor build ci docs test style other; do
              if [ -s ".release/${key}.md" ]; then
                case "${key}" in
                  feat) title="新功能" ;;
                  fix) title="问题修复" ;;
                  perf) title="性能优化" ;;
                  refactor) title="重构" ;;
                  build) title="构建与依赖" ;;
                  ci) title="CI/CD" ;;
                  docs) title="文档" ;;
                  test) title="测试" ;;
                  style) title="代码风格" ;;
                  *) title="其他改动" ;;
                esac
                echo "### ${title}"
                echo ""
                cat ".release/${key}.md"
                echo ""
              fi
            done
            echo "## 贡献者"
            echo ""
            echo "${CONTRIBUTORS}"
            echo ""
            echo "## 对比"
            echo ""
            echo "${COMPARE}"
          } > release-notes.md

          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GHealth Tools v${{ steps.tag_version.outputs.VERSION }}"
          body_path: release-notes.md
          files: app/build/outputs/apk/release/ghealth-tools-${{ steps.tag_version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
